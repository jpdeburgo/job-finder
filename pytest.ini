[pytest]
# Runs the archive.py tests (tests/) and the backend suite (backend/tests)
# together:
#   pytest                 (repo root: both)
#   cd backend && pytest   (backend only)
# Backend tests belong in backend/tests. tests/ is only for archive.py and
# has no __init__.py on purpose: two packages named `tests` would collide.
pythonpath = . backend
testpaths = tests backend/tests
