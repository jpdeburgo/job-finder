services:
  - type: cron
    name: insight-global-job-search
    runtime: python
    # The search script lives in backend/; the Next.js dashboard in frontend/
    # is not deployed by this Blueprint.
    rootDir: backend
    schedule: "0 13 * * *"
    buildCommand: pip install pipenv && pipenv install --system --deploy
    startCommand: python -u job_search.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GMAIL_CREDENTIALS_PATH
        value: /etc/secrets/credentials.json
      - key: GMAIL_TOKEN_PATH
        value: /etc/secrets/token.json
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firebase-service-account.json
      # Fail loudly if the key file is missing instead of silently writing to
      # a throwaway local_firestore.json on the cron host.
      - key: IG_STATE_BACKEND
        value: firestore
      - key: IG_EMAIL_TO
        sync: false
      # Fail the run if the Gmail secret files or IG_EMAIL_TO go missing. Locally,
      # the script just prints that email isn't set up and carries on.
      - key: IG_REQUIRE_EMAIL
        value: "true"
